[project]
name = "aff-parser"
version = "0.1.0"
description = "Arcaea File Format (AFF) parser and objects"
requires-python = ">=3.10"
authors = [
    { name = "Aurous" }
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aff*"]
exclude = ["test*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
